name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: agriflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_URL: mysql://root:ci-only-password@127.0.0.1:3306/agriflow_test
      MYSQL_E2E_URL: mysql://root:ci-only-password@127.0.0.1:3306/agriflow_e2e_test
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the end-to-end test database
        run: >-
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -pci-only-password
          -e "CREATE DATABASE IF NOT EXISTS agriflow_e2e_test"
      - name: Typecheck, lint and test
        run: pnpm check
      - name: Build the dashboards
        run: pnpm --filter @agriflow/dashboard build
